<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- 标题与描述：卡片主标题和简介 -->
    <meta name="description" content="运用了 Argon2id 和 AES-256-GCM 的算法">
    <meta property="og:title" content="私房钱 - 全程无网络请求，本机运行的加密工具">
    <meta property="og:description" content="运用了 Argon2id 和 AES-256-GCM 的算法">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://mingjue8888.github.io/stashbox">
    <meta property="og:site_name" content="私房钱 - 全程无网络请求，本机运行的加密工具">
    <!-- 卡片缩略图 / logo：必须是能公开访问的图片 URL -->
    <meta property="og:image" content="https://mingjue8888.github.io/stashbox/logo.png">
    <meta property="og:image:width" content="200">
    <meta property="og:image:height" content="200">
    <meta property="og:image:type" content="image/png">
    <!-- 兼容 Twitter / X 的卡片（可选，微信等也会读 og:） -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="私房钱 - 全程无网络请求，本机运行的加密工具">
    <meta name="twitter:description" content="运用了 Argon2id 和 AES-256-GCM 的算法">
    <meta name="twitter:image" content="https://mingjue8888.github.io/stashbox/logo.png">
    <link rel="icon" href="./logo.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <link rel="stylesheet" href="./index.css">
    <title>私房钱 - 全程无网络请求，本机运行的加密工具</title>
</head>
<body>
<section class="hero is-primary">
    <div class="hero-body">
        <div class="container">
            <h1 class="title is-3 hero-dark">偷偷藏点私房钱</h1>
            <p class="subtitle is-6 hero-dark" style="margin-top:0.3rem">全程无网络请求，本机运行的加密工具，运用了 <i>Argon2id</i> 和 <i>AES-256-GCM</i> 的算法</p>
        </div>
    </div>
</section>
<section class="section">
    <div class="container">
        <div class="columns is-desktop">
            <!-- ===== 加密 ===== -->
            <div class="column is-half">
                <div class="box">
                    <h2 class="title is-4">加密</h2>

                    <div class="field">
                        <label class="label">密码</label>
                        <div class="field has-addons">
                            <div class="control is-expanded">
                                <input id="encPass" class="input" type="password" autocomplete="new-password" placeholder="请输入只有你自己知道的密码">
                            </div>
                            <div class="control">
                                <button id="encEye" class="button" type="button" aria-label="长按显示密码"><span class="icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></span></button>
                            </div>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">明文</label>
                        <div class="control">
                            <textarea id="encText" class="textarea" autocomplete="off" placeholder="请输入你要加密的文本内容，加密后明文建议不要保留"></textarea>
                        </div>
                    </div>

                    <button id="btnEncrypt" class="button is-primary is-fullwidth">加密</button>

                    <div class="field mt-4">
                        <label class="label">密文</label>
                        <div class="control">
                            <textarea id="encOut" class="textarea mono" readonly autocomplete="off" placeholder="加密结果将在这里显示，建议备几份藏在你自己能找到的别人不知道的任意互联网角落里"></textarea>
                        </div>
                        <div class="has-text-right mt-2"><button id="btnCopy" class="button is-small is-light">复制密文</button></div>
                    </div>
                </div>
            </div>

            <!-- ===== 解密 ===== -->
            <div class="column is-half">
                <div class="box">
                    <h2 class="title is-4">解密</h2>

                    <div class="field">
                        <label class="label">密码</label>
                        <div class="field has-addons">
                            <div class="control is-expanded">
                                <input id="decPass" class="input" type="password" autocomplete="new-password" placeholder="请输入只有你自己知道的密码">
                            </div>
                            <div class="control">
                                <button id="decEye" class="button" type="button" aria-label="长按显示密码"><span class="icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></span></button>
                            </div>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">密文</label>
                        <div class="control">
                            <textarea id="decBox" class="textarea mono" autocomplete="off" placeholder="请粘贴你上一次藏好的加密文本"></textarea>
                        </div>
                    </div>

                    <button id="btnDecrypt" class="button is-primary is-fullwidth">解密</button>

                    <div id="decStatus" class="notification mt-4" style="display:none"></div>

                    <div class="field mt-4">
                        <label class="label">明文</label>
                        <div class="control">
                            <textarea id="decOut" class="textarea" readonly autocomplete="off" placeholder="解密结果将在这里显示，拿回你原有的明文后，请不要逗留太久，把浏览痕迹删掉"></textarea>
                        </div>
                        <div class="has-text-right mt-2"><button id="btnCopyPlain" class="button is-small is-light">复制明文</button></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<footer class="footer">
    <div class="container">
        <p class="has-text-grey format-line">
            锁定算法：Argon2id · 内存 256MB · 迭代 32 次 · 并行度 2 · 盐 16B · 密钥长度 32B · AES-256-GCM · IV 12B · 认证 tag 16B · 密文格式 &lt;盐&gt;.&lt;iv&gt;.&lt;认证 tag&gt;.&lt;算法结果&gt;，每份密文独立随机盐，认证 tag 承载完整性校验，密文被篡改或密码错误将无法解密。
        </p>
        <p class="has-text-grey-light format-line mt-2">浏览器端运行，使用 Web Crypto 与 argon2-browser(WASM)。所有计算均在本机完成。</p>
    </div>
</footer>

<div id="toast" class="notification is-info" style="position:fixed;right:16px;bottom:16px;z-index:99"></div>

<script src="https://cdn.jsdelivr.net/npm/argon2-browser@1.18.0/dist/argon2-bundled.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/rxjs@6.6.7/bundles/rxjs.umd.min.js"></script>
<script src="./argon2id-aes256gcm.umd.js"></script>
<script src="./index.js"></script>
</body>
</html>
