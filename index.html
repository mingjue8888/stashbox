<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- 标题与描述：卡片主标题和简介 -->
    <meta name="description" content="运用了 Argon2id 和 AES-256-GCM 的算法">
    <meta property="og:title" content="私房钱 - 全程无网络请求，本机运行的加密工具">
    <meta property="og:description" content="运用了 Argon2id 和 AES-256-GCM 的算法">

    <!-- 兼容 Twitter / X 的卡片（可选，微信等也会读 og:） -->

    <meta name="twitter:title" content="私房钱 - 全程无网络请求，本机运行的加密工具">
    <meta name="twitter:description" content="运用了 Argon2id 和 AES-256-GCM 的算法">
    <meta name="twitter:image" content="https://mingjue8888.github.io/stashbox/logo.png">

    <style>
        html { scroll-behavior: auto; }
        body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", "Noto Sans SC", sans-serif; }
        .hero { background: #f5f7fb; }
        .hero .hero-dark { color: #000 !important; }
        .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
        #encOut, #decBox { resize: vertical; min-height: 96px; }
        #btnEncrypt, #btnDecrypt { min-height: 2.5em; }  /* loading 无字时保持原高度 */
        #toast { opacity: 0; pointer-events: none; }
        #toast.show { animation: toastFlash 2.2s ease forwards; }
        @keyframes toastFlash {
            0% { opacity: 0; }
            12% { opacity: 1; }
            88% { opacity: 1; }
            100% { opacity: 0; }
        }
        .tool-card { max-width: 720px; margin: 0 auto; }
        .tabs.is-boxed li.is-active a { background: #485fc7; color: #fff; }
        .tabs a { min-width: 120px; justify-content: center; }
        .format-line { font-size: .85rem; }

        /* 锁定浅色配色：中间白、底部灰、顶部蓝，不受系统深色模式影响 */
        :root { color-scheme: light; }
        html { color-scheme: light; }
        body { background: #fff; color: #212121; }
        .box, .modal-card { background: #fff; color: #212121;
            box-shadow: 0 .5em 1em -0.125em rgba(10,10,10,.1), 0 0 0 1px rgba(10,10,10,.02); }
        .input, .textarea { background: #fff; color: #212121; }
        .input::placeholder, .textarea::placeholder { color: #8a8a8a; }
        .label { color: #363636; }
        .footer { background-color: #f5f5f5 !important; color: #4a4a4a; }
        .notification { color: #4a4a4a; }
        .notification.is-danger { color: #fff !important; }
        .hero.is-primary { background-color: var(--bulma-primary) !important; }
        .hero .title { color: #111 !important; }
        .hero .subtitle { color: #333 !important; }
        .box .title { color: #111 !important; }
        .button.is-dark.is-loading:disabled {
            background-color: #363636 !important;
            border-color: #363636 !important;
            color: #fff !important;
            opacity: 1;
        }

        @media (prefers-color-scheme: dark) {
            :root, html { color-scheme: light; }
            body { background: #fff !important; color: #212121 !important; }
            .box, .modal-card { background: #fff !important; color: #212121 !important;
                box-shadow: 0 .5em 1em -0.125em rgba(10,10,10,.1), 0 0 0 1px rgba(10,10,10,.02) !important; }
            .input, .textarea { background: #fff !important; color: #212121 !important; }
            .input::placeholder, .textarea::placeholder { color: #8a8a8a !important; }
            .label { color: #363636 !important; }
            .footer { background-color: #f5f5f5 !important; color: #4a4a4a !important; }
            .notification { color: #4a4a4a !important; }
            .notification.is-danger { color: #fff !important; }
            .hero.is-primary { background-color: var(--bulma-primary) !important; }
            .hero .title { color: #111 !important; }
            .hero .subtitle { color: #333 !important; }
            .box .title { color: #111 !important; }
            .button.is-dark.is-loading:disabled {
                background-color: #363636 !important;
                border-color: #363636 !important;
                color: #fff !important;
                opacity: 1;
            }
        }
    </style>
</head>
<body>
<section class="hero is-primary">
    <div class="hero-body">
        <div class="container">
            <h1 class="title is-3 hero-dark">偷偷藏点私房钱</h1>
            <p class="subtitle is-6 hero-dark" style="margin-top:1.25rem">全程无网络请求，本机运行的加密工具，运用了 <i>Argon2id</i> 和 <i>AES-256-GCM</i> 的算法</p>
        </div>
    </div>
</section>
<section class="section">
    <div class="container">
        <div class="columns is-desktop">
            <!-- ===== 加密 ===== -->
            <div class="column is-half">
                <div class="box">
                    <h2 class="title is-4">加密</h2>

                    <div class="field">
                        <label class="label">密码</label>
                        <div class="field has-addons">
                            <div class="control is-expanded">
                                <input id="encPass" class="input" type="password" placeholder="请输入只有你自己知道的密码">
                            </div>
                            <div class="control">
                                <button id="encEye" class="button" type="button" aria-label="长按显示密码"><span class="icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></span></button>
                            </div>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">明文</label>
                        <div class="control">
                            <textarea id="encText" class="textarea" placeholder="请输入你要加密的文本内容，加密后明文建议不要保留"></textarea>
                        </div>
                    </div>

                    <button id="btnEncrypt" class="button is-primary is-fullwidth">加密</button>

                    <div class="field mt-4">
                        <label class="label">密文</label>
                        <div class="control">
                            <textarea id="encOut" class="textarea mono" readonly placeholder="加密结果将在这里显示，建议备几份藏在你自己能找到的别人不知道的任意互联网角落里"></textarea>
                        </div>
                        <div class="has-text-right mt-2"><button id="btnCopy" class="button is-small is-light">复制密文</button></div>
                    </div>
                </div>
            </div>

            <!-- ===== 解密 ===== -->
            <div class="column is-half">
                <div class="box">
                    <h2 class="title is-4">解密</h2>

                    <div class="field">
                        <label class="label">密码</label>
                        <div class="field has-addons">
                            <div class="control is-expanded">
                                <input id="decPass" class="input" type="password" placeholder="请输入只有你自己知道的密码">
                            </div>
                            <div class="control">
                                <button id="decEye" class="button" type="button" aria-label="长按显示密码"><span class="icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></span></button>
                            </div>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">密文</label>
                        <div class="control">
                            <textarea id="decBox" class="textarea mono" placeholder="请粘贴你上一次藏好的加密文本"></textarea>
                        </div>
                    </div>

                    <button id="btnDecrypt" class="button is-primary is-fullwidth">解密</button>

                    <div id="decStatus" class="notification mt-4" style="display:none"></div>

                    <div class="field mt-4">
                        <label class="label">明文</label>
                        <div class="control">
                            <textarea id="decOut" class="textarea" readonly placeholder="解密结果将在这里显示，拿回你原有的明文后，请不要逗留太久，把浏览痕迹删掉"></textarea>
                        </div>
                        <div class="has-text-right mt-2"><button id="btnCopyPlain" class="button is-small is-light">复制明文</button></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<footer class="footer">
    <div class="container">
        <p class="has-text-grey format-line">
            锁定算法：Argon2id · 内存 256MB · 迭代 32 次 · 并行度 2 · 盐 16B · 密钥长度 32B · AES-256-GCM · IV 12B · 认证 tag 16B · 密文格式 &lt;盐&gt;.&lt;iv&gt;.&lt;认证 tag&gt;.&lt;算法结果&gt;，每份密文独立随机盐，认证 tag 承载完整性校验，密文被篡改或密码错误将无法解密。
        </p>
        <p class="has-text-grey-light format-line mt-2">浏览器端运行，使用 Web Crypto 与 argon2-browser(WASM)。所有计算均在本机完成。</p>
    </div>
</footer>

<div id="toast" class="notification is-info" style="position:fixed;right:16px;bottom:16px;z-index:99"></div>

<script src="https://cdn.jsdelivr.net/npm/argon2-browser@1.18.0/dist/argon2-bundled.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/rxjs@6.6.7/bundles/rxjs.umd.min.js"></script>
<script src="./argon2id-aes256gcm.umd.js"></script>
<script>
/* ===== 页面逻辑（函数式 + RxJS Observable） ===== */
(function () {
    "use strict";
    const $ = (id) => document.getElementById(id);
    const { fromEvent, of, from, defer, pipe } = rxjs;
    const { map, switchMap, startWith, catchError } = rxjs.operators;

    /* ---------- 加密实例（参数写死，不暴露给用户） ---------- */
    const crypt = argon2id_aes256gcm({
        argonMemory: 262144,  // 256 MiB
        argonTimes: 32,
        argonParallelism: 2
    });

    /* ---------- 状态构造（纯函数） ---------- */
    const okState = (extra) => {
        const s = { status: "ok" };
        for (const k in extra) s[k] = extra[k];
        return s;
    };
    const errState = (msg) => ({ status: "error", msg });

    /* ---------- 密码校验：前后空格去掉 + 16 位复杂密码 ---------- */
    const validatePassword = (raw) => {
        const pass = (raw || "").trim();                       // 去掉前后空格
        if (pass.length < 16)              return { ok: false, pass: "", msg: "密码至少 16 位" };
        if (/\s/.test(pass))               return { ok: false, pass: "", msg: "密码中间不能有空格" };
        if (!/[a-z]/.test(pass))           return { ok: false, pass: "", msg: "密码需包含小写字母" };
        if (!/[A-Z]/.test(pass))           return { ok: false, pass: "", msg: "密码需包含大写字母" };
        if (!/[0-9]/.test(pass))           return { ok: false, pass: "", msg: "密码需包含数字" };
        if (!/[^A-Za-z0-9]/.test(pass))    return { ok: false, pass: "", msg: "密码需包含标点符号" };
        return { ok: true, pass, msg: "" };
    };

    /* ---------- DOM 读取（纯函数） ---------- */
    const readEnc = () => ({ pass: $("encPass").value, text: $("encText").value });
    const readDec = () => ({ pass: $("decPass").value, box: $("decBox").value.trim() });

    /* ---------- 请求校验（纯函数） ---------- */
    const validateEncReq = (f) => {
        if (!f.text.trim()) return errState("请填写要加密的明文");
        const v = validatePassword(f.pass);
        return v.ok ? okState({ pass: v.pass, text: f.text }) : errState(v.msg);
    };
    const validateDecReq = (f) => {
        if (!f.box) return errState("请粘贴密文");
        const v = validatePassword(f.pass);
        return v.ok ? okState({ pass: v.pass, box: f.box }) : errState(v.msg);
    };

    /* ---------- 异步操作 → observable（先 working 再 done/error） ---------- */
    // 进入 Argon2 计算前先让出一次事件循环，强制浏览器先绘制 working 态（按钮 loading），
    // 否则 WASM 同步计算直接占满主线程，loading 中间态画不到屏幕上。
    const runTask = (task) => (async () => {
        await new Promise((r) => setTimeout(r, 0));
        return task();
    })();
    const runEncrypt = (req) =>
        defer(() => from(runTask(() => crypt.encrypt(req.pass, req.text)))).pipe(
            map((v) => ({ status: "done", value: v })),
            startWith({ status: "working" }),
            catchError((e) => of(errState(e.message || String(e))))
        );
    const runDecrypt = (req) =>
        defer(() => from(runTask(() => crypt.decrypt(req.pass, req.box)))).pipe(
            map((v) => ({ status: "done", value: v })),
            startWith({ status: "working" }),
            catchError((e) => of(errState(e.message || String(e))))
        );
    const handleOp = (req, run) => (req.status === "ok" ? run(req) : of(req));

    /* ---------- 渲染（纯函数 → DOM） ---------- */
    const btnLoading = (btn, label) => (loading) => {
        btn.disabled = loading;                       // 防误触：计算期间禁用按钮
        btn.classList.toggle("is-loading", loading);
        btn.classList.toggle("is-dark", loading);
        btn.textContent = loading ? "" : label;       // loading 时按钮内不留字，只留转圈
    };
    const showToast = (msg, type) => {
        const toast = $("toast");
        const kind = type === "danger" ? "is-danger" : "is-info";
        toast.classList.remove("is-info", "is-danger");
        toast.classList.add(kind);
        toast.textContent = msg;
        // 用 CSS 动画自动淡出（不受主线程阻塞影响），重触发需先移除 show 再强制重排
        toast.classList.remove("show");
        void toast.offsetWidth;
        toast.classList.add("show");
    };
    const renderEnc = (state) => {
        const setLoading = btnLoading($("btnEncrypt"), "加密");
        if (state.status === "working") { setLoading(true); $("encOut").value = ""; showToast("加密中"); }
        else {
            setLoading(false);
            if (state.status === "done") { $("encOut").value = state.value; showToast("加密完成"); }
            else if (state.status === "error") showToast("加密失败：" + state.msg);
        }
    };
    const renderDec = (state) => {
        const setLoading = btnLoading($("btnDecrypt"), "解密");
        if (state.status === "working") { setLoading(true); $("decOut").value = ""; showToast("解密中"); }
        else {
            setLoading(false);
            if (state.status === "done") { $("decOut").value = state.value; showToast("解密成功，认证通过"); }
            else if (state.status === "error") showToast("解密失败：" + state.msg + "。请检查密码和密文是否与加密时一致。", "danger");
        }
    };

    /* ---------- 复制（RxJS 流） ---------- */
    const renderCopy = (s, okMsg, out) => {
        if (s.status === "done") return showToast(okMsg);
        if (s.status === "fallback") { out.select(); return showToast("复制失败，已帮你选中，请 Ctrl+C"); }
        if (s.status === "none") return showToast(okMsg === "已复制密文" ? "还没有密文可复制" : "还没有明文可复制");
    };
    const buildCopy = (btn, out, okMsg) => {
        fromEvent(btn, "click").pipe(
            map(() => out.value),
            switchMap((text) =>
                text
                    ? from(navigator.clipboard.writeText(text)).pipe(
                        map(() => ({ status: "done" })),
                        catchError(() => of({ status: "fallback" }))
                    )
                    : of({ status: "none" })
            )
        ).subscribe((s) => renderCopy(s, okMsg, out));
    };

    /* ---------- 组装数据流（RxJS 订阅） ---------- */
    fromEvent($("btnEncrypt"), "click").pipe(
        map(readEnc),
        map(validateEncReq),
        switchMap((req) => handleOp(req, runEncrypt))
    ).subscribe(renderEnc);

    fromEvent($("btnDecrypt"), "click").pipe(
        map(readDec),
        map(validateDecReq),
        switchMap((req) => handleOp(req, runDecrypt))
    ).subscribe(renderDec);

    buildCopy($("btnCopy"), $("encOut"), "已复制密文");
    buildCopy($("btnCopyPlain"), $("decOut"), "已复制明文");

    /* ---------- 密码框长按显示（函数式） ---------- */
    const bindEye = (input, btn) => {
        const show = (e) => { if (e) e.preventDefault(); input.type = "text"; };
        const hide = () => { input.type = "password"; };
        btn.addEventListener("pointerdown", show);
        btn.addEventListener("pointerup", hide);
        btn.addEventListener("pointerleave", hide);
    };
    bindEye($("encPass"), $("encEye"));
    bindEye($("decPass"), $("decEye"));
})();
</script>
</body>
</html>
