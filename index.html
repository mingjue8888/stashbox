<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="./logo.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <title>私房钱 - 全程无网络请求，本机运行的加密工具</title>
    <script src="https://cdn.jsdelivr.net/npm/argon2-browser@1.18.0/dist/argon2-bundled.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/joi@18.2.9/dist/joi-browser.min.js"></script>
    <script src="./argon2id-aes256gcm.umd.js"></script>
</head>
<body>
    Hello world!
    <script>
        const password = "SuperPassword.123456.IamYourDaddy";
        const text = "Hello world!";

        const crypt = argon2id_aes256gcm({
            argonMemory: 262144,       // Argon2 内存 KiB
            argonTimes: 32,            // 迭代次数
            argonParallelism: 2,      // 并行度
        });

        (async function() {
            console.time("encrypt");
            const encryptedText  = await crypt.encrypt(password, text);
            console.timeEnd("encrypt");
            console.time("decrypt");
            const sourceText = await crypt.decrypt(password, encryptedText);
            console.timeEnd("decrypt");
            console.log(encryptedText, sourceText);
        })();
    </script>
</body>
</html>
